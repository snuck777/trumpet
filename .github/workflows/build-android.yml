name: Build Android APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & prepare web assets
        run: |
          npm install
          mkdir -p www
          cp index.html www/index.html

      - name: Initialize Capacitor Android Project
        run: |
          npx cap init "트럼펫 마스터" com.snuck777.trumpetmaster --web-dir www
          npx cap add android

      - name: Set Landscape Orientation & App Icon
        run: |
          sed -i 's/android:exported="true"/android:exported="true" android:screenOrientation="sensorLandscape"/g' android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK & Release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trumpet-master-android-builds
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
